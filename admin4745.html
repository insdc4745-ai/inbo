<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#132c27">
    <title>인원보고 Viewer</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { --ink:#142a25; --muted:#718079; --paper:#f1f4ef; --card:#fff; --line:#e1e8e2; --green:#132c27; --mint:#dfeee5; --yellow:#f3c95b; --red:#b74d47; }
        * { box-sizing:border-box; }
        body { margin:0; color:var(--ink); background:var(--paper); font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif; word-break:keep-all; }
        button, input, select { font:inherit; }
        button { cursor:pointer; }
        .app { width:min(100% - 32px,680px); margin:0 auto; padding:20px 0 calc(32px + env(safe-area-inset-bottom)); }
        .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
        .brand { display:flex; align-items:center; gap:10px; }
        .brand-mark { display:grid; place-items:center; width:38px; height:38px; color:var(--green); background:var(--yellow); border-radius:12px; font-weight:900; }
        .brand h1 { margin:0; font-size:16px; letter-spacing:-.05em; }
        .brand p { margin:3px 0 0; color:var(--muted); font-size:11px; }
        .icon-button { display:grid; place-items:center; width:40px; height:40px; color:var(--green); background:var(--card); border:1px solid var(--line); border-radius:12px; font-size:18px; }
        .hero { position:relative; overflow:hidden; padding:24px 22px 22px; color:#fff; background:var(--green); border-radius:18px; box-shadow:0 14px 32px rgba(19,44,39,.14); }
        .hero::after { content:''; position:absolute; width:180px; height:180px; right:-78px; top:-78px; border:1px solid rgba(243,201,91,.4); border-radius:50%; box-shadow:0 0 0 18px rgba(243,201,91,.06); }
        .hero-label { position:relative; z-index:1; margin:0 0 16px; color:var(--yellow); font-size:11px; font-weight:800; letter-spacing:.13em; }
        .hero h2 { position:relative; z-index:1; margin:0; font-size:30px; line-height:1.1; letter-spacing:-.07em; }
        .hero-meta { position:relative; z-index:1; display:flex; gap:7px; margin-top:18px; color:rgba(255,255,255,.7); font-size:12px; }
        .hero-meta span { padding:5px 8px; background:rgba(255,255,255,.1); border-radius:6px; }
        .section { margin-top:14px; padding:18px; background:var(--card); border:1px solid rgba(20,42,37,.05); border-radius:16px; box-shadow:0 5px 18px rgba(24,48,40,.05); }
        .room-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        .room-card { padding:13px; color:var(--ink); background:#f7f9f6; border:1px solid var(--line); border-radius:11px; text-align:left; }
        .room-card.active { color:#fff; background:var(--green); border-color:var(--green); }
        .room-name { display:block; font-size:14px; font-weight:800; }
        .room-meta { display:flex; justify-content:space-between; gap:8px; margin-top:8px; color:var(--muted); font-size:10px; }
        .room-card.active .room-meta { color:rgba(255,255,255,.65); }
        .room-card strong { font-size:18px; }
        .room-empty { padding:20px 0; color:var(--muted); font-size:13px; text-align:center; }
        .section-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:15px; }
        .section-title h3 { margin:0; font-size:16px; letter-spacing:-.04em; }
        .section-title p { margin:0; color:var(--muted); font-size:11px; }
        .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .stat { padding:13px 12px; background:#f7f9f6; border-radius:11px; }
        .stat strong { display:block; font-size:22px; letter-spacing:-.06em; }
        .stat span { display:block; margin-top:3px; color:var(--muted); font-size:11px; }
        .controls { display:flex; gap:8px; }
        .controls input, .controls select { height:42px; padding:0 11px; color:var(--ink); background:#f8faf8; border:1px solid var(--line); border-radius:9px; outline:none; }
        .controls input { min-width:0; flex:1; }
        .controls select { width:106px; }
        .people { display:grid; gap:8px; }
        .person { display:grid; grid-template-columns:1fr auto; gap:8px; padding:13px; border:1px solid var(--line); border-radius:11px; }
        .person-main { min-width:0; }
        .person-name { overflow:hidden; font-size:15px; font-weight:800; text-overflow:ellipsis; white-space:nowrap; }
        .person-info { margin-top:4px; color:var(--muted); font-size:11px; }
        .person-statuses { display:flex; align-items:center; justify-content:flex-end; gap:5px; flex-wrap:wrap; }
        .status { display:inline-flex; align-items:center; padding:5px 7px; color:var(--muted); background:#f1f4f1; border-radius:6px; font-size:10px; font-weight:700; }
        .status.absent { color:#8c3935; background:#fff0ee; }
        .status.ok { color:#397653; background:#e6f3e9; }
        .report { width:100%; min-height:220px; padding:14px; color:#eaf4ed; background:#102d26; border:0; border-radius:10px; resize:vertical; outline:none; font-size:12px; line-height:1.7; }
        .report-room { margin-top:18px; padding-top:18px; border-top:1px solid var(--line); }
        .report-room:first-child { margin-top:0; padding-top:0; border-top:0; }
        .report-room-title { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; }
        .report-room-title strong { font-size:15px; }
        .report-room-title span { color:var(--muted); font-size:10px; }
        .report-table-wrap { overflow-x:auto; margin:0 -2px; padding-bottom:4px; }
        .report-table { width:100%; min-width:860px; border-collapse:collapse; font-size:11px; }
        .report-table th { padding:8px 7px; color:var(--muted); background:#f5f8f5; font-size:10px; font-weight:800; white-space:nowrap; }
        .report-table td { padding:9px 7px; border-bottom:1px solid var(--line); text-align:center; vertical-align:top; white-space:nowrap; }
        .report-table td:first-child { font-weight:800; text-align:left; }
        .report-table .detail-row td { color:var(--muted); background:#fbfcfb; text-align:left; white-space:normal; line-height:1.55; }
        .report-table .detail-label { color:var(--ink); font-weight:800; }
        .report-empty { padding:20px 0; color:var(--muted); text-align:center; font-size:12px; }
        .report-actions { display:flex; gap:8px; margin-top:10px; }
        .button { flex:1; height:44px; border:0; border-radius:9px; font-size:12px; font-weight:800; }
        .button.primary { color:var(--green); background:var(--yellow); }
        .button.secondary { color:var(--green); background:var(--mint); }
        .empty { padding:26px 8px; color:var(--muted); text-align:center; font-size:13px; }
        .notice { padding:13px; color:#6d5b23; background:#fff8df; border:1px solid #f0df9f; border-radius:10px; font-size:11px; line-height:1.55; }
        .toast { position:fixed; left:50%; bottom:22px; z-index:3; padding:11px 16px; color:#fff; background:var(--ink); border-radius:999px; opacity:0; pointer-events:none; transform:translate(-50%,12px); transition:.2s; font-size:12px; white-space:nowrap; }
        .toast.show { opacity:1; transform:translate(-50%,0); }
        @media (max-width:560px) { .app { width:100%; padding:12px 12px calc(24px + env(safe-area-inset-bottom)); } .topbar { margin:0 4px 14px; } .hero { padding:22px 18px 18px; border-radius:15px; } .hero h2 { font-size:28px; } .section { padding:16px 14px; border-radius:13px; } .stats { gap:6px; } .stat { padding:12px 9px; } .stat strong { font-size:20px; } .room-grid { grid-template-columns:1fr 1fr; } .room-card { padding:11px; } .person { grid-template-columns:1fr; } .person-statuses { justify-content:flex-start; } .status { flex:1; justify-content:center; } }
    </style>
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div class="brand"><span class="brand-mark">박</span><div><h1>인원보고 Viewer</h1><p>관리자 모바일 대시보드</p></div></div>
            <button class="icon-button" id="refreshButton" aria-label="새로고침" title="새로고침">↻</button>
        </header>
        <section class="hero"><p class="hero-label">PERSONNEL REPORT · VIEWER</p><h2 id="heroTitle">전체 생활반 인원보고</h2><div class="hero-meta"><span id="heroDate">-</span><span id="heroWeekend">생활반 0개</span></div></section>
        <section class="section"><div class="section-title"><div><h3>생활반 현황</h3><p>확인할 생활반을 선택하세요.</p></div></div><div class="room-grid" id="roomGrid"></div></section>
        <section class="section"><div class="section-title"><div><h3>현황 요약</h3><p>마지막 저장 데이터 기준</p></div></div><div class="stats"><div class="stat"><strong id="totalCount">0</strong><span>총원</span></div><div class="stat"><strong id="presentCount">0</strong><span>현재원</span></div><div class="stat"><strong id="absentCount">0</strong><span>부재 인원</span></div></div></section>
        <section class="section"><div class="section-title"><div><h3>전체 인원 목록</h3><p id="listDescription">전체 생활반 인원</p></div></div><div class="controls"><input id="searchInput" type="search" placeholder="이름 또는 소속 검색"><select id="filterSelect"><option value="all">전체 상태</option><option value="present">정상</option><option value="absent">부재</option></select></div><div class="people" id="peopleList"></div></section>
        <section class="section"><div class="section-title"><div><h3>생활반별 보고서</h3><p>항목별 통계와 세부 인원을 확인하세요.</p></div></div><div id="reportTables"></div><textarea class="report" id="reportOutput" readonly hidden></textarea><div class="report-actions"><button class="button secondary" id="copyButton">보고서 복사</button><button class="button primary" id="openReportButton">맨 위로</button></div></section>
        <div class="section notice">최신 보고서는 API에서 불러오며, API 연결이 끊긴 경우 브라우저에 저장된 데이터를 대신 표시합니다.</div>
    </main>
    <div class="toast" id="toast"></div>
    <script>
        const rankOrder = { 병장:4, 상병:3, 일병:2, 이병:1 };
        const categoryNames = { rollCall:'점호', group:'조별', weekend:'주말' };
        const $ = (id) => document.getElementById(id);
        let rooms = {};
        let selectedRoom = 'all';
        const API_URL = 'https://api.findflag.kr/insdc15/0';
        function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char])); }
        function normaliseRooms(source) {
            if (source && typeof source === 'object' && Object.values(source).some((room) => room?.status?.totalPerson)) return source;
            if (source?.people) return { [source.unitNumber ? `${source.unitNumber}생활반` : '생활반']: { status:{ total:source.people.length, totalPerson:source.people.map((person, index) => ({ ...person, rollCall:source.statuses?.점호?.[index] || '정상', group:source.statuses?.조별?.[index] || '정상', weekend:source.statuses?.주말점검?.[index] || '정상' })), dateStr:'', reporter:'' }, updated:'' } };
            return {};
        }
        function loadRoomsFromStorage() {
            rooms = {};
            const preferredKeys = ['livingRoomReports','personnelReports','roomReports','생활반보고'];
            preferredKeys.forEach((key) => { try { const value = JSON.parse(localStorage.getItem(key) || 'null'); if (value) rooms = { ...rooms, ...normaliseRooms(value) }; } catch {} });
            for (let index = 0; index < localStorage.length; index += 1) { const key = localStorage.key(index); if (preferredKeys.includes(key) || key === 'personnelReport') continue; try { const value = JSON.parse(localStorage.getItem(key) || 'null'); const discovered = normaliseRooms(value); if (Object.keys(discovered).length) rooms = { ...rooms, ...discovered }; } catch {} }
            if (!Object.keys(rooms).length) { try { rooms = normaliseRooms(JSON.parse(localStorage.getItem('personnelReport') || 'null')); } catch {} }
            if (selectedRoom !== 'all' && !rooms[selectedRoom]) selectedRoom = 'all';
        }
        async function loadRooms() {
            try {
                const response = await fetch(API_URL, { cache:'no-store' });
                if (!response.ok) throw new Error(`API ${response.status}`);
                const remoteRooms = normaliseRooms(await response.json());
                if (!Object.keys(remoteRooms).length) throw new Error('생활반 데이터 없음');
                rooms = remoteRooms;
                if (selectedRoom !== 'all' && !rooms[selectedRoom]) selectedRoom = 'all';
                return true;
            } catch (error) {
                loadRoomsFromStorage();
                return false;
            }
        }
        function roomEntries() { return Object.entries(rooms).sort(([a], [b]) => a.localeCompare(b, 'ko', { numeric:true })); }
        function allPeople() { return roomEntries().flatMap(([roomName, room]) => (room.status?.totalPerson || []).map((person) => ({ ...person, roomName }))); }
        function statusIsAbsent(person) { return [person.rollCall, person.group, person.weekend].some((value) => value && value !== '정상'); }
        function renderRooms() {
            const entries = roomEntries();
            $('roomGrid').innerHTML = entries.length ? `<button class="room-card ${selectedRoom === 'all' ? 'active' : ''}" data-room="all"><span class="room-name">전체 생활반</span><span class="room-meta"><span>${allPeople().length}명</span><strong>${entries.length}</strong></span></button>${entries.map(([name, room]) => `<button class="room-card ${selectedRoom === name ? 'active' : ''}" data-room="${escapeHtml(name)}"><span class="room-name">${escapeHtml(name)}</span><span class="room-meta"><span>${room.status?.totalPerson?.length || room.status?.total || 0}명</span><strong>›</strong></span></button>`).join('')}` : '<div class="room-empty">저장된 생활반 보고서가 없습니다.</div>';
            document.querySelectorAll('[data-room]').forEach((button) => button.addEventListener('click', () => { selectedRoom = button.dataset.room; renderRooms(); renderSummary(); renderPeople(); renderReport(); }));
        }
        function selectedPeople() { return selectedRoom === 'all' ? allPeople() : (rooms[selectedRoom]?.status?.totalPerson || []).map((person) => ({ ...person, roomName:selectedRoom })); }
        function renderSummary() { const people = selectedPeople(); const absent = people.filter(statusIsAbsent).length; $('totalCount').textContent = people.length; $('absentCount').textContent = absent; $('presentCount').textContent = people.length - absent; $('heroTitle').textContent = selectedRoom === 'all' ? '전체 생활반 인원보고' : `${selectedRoom} 인원보고`; $('heroWeekend').textContent = selectedRoom === 'all' ? `생활반 ${roomEntries().length}개` : `${rooms[selectedRoom]?.status?.dateStr || '보고서 확인'}`; $('heroDate').textContent = roomEntries().map(([, room]) => room.status?.dateStr).find(Boolean) || new Intl.DateTimeFormat('ko-KR', { dateStyle:'long' }).format(new Date()); }
        function renderPeople() { const query = $('searchInput').value.trim().toLowerCase(); const filter = $('filterSelect').value; const people = selectedPeople().filter((person) => { const searchable = `${person.name} ${person.unit || ''} ${person.roomName}`.toLowerCase(); const absent = statusIsAbsent(person); return (!query || searchable.includes(query)) && (filter === 'all' || (filter === 'absent' ? absent : !absent)); }).sort((a,b) => rankOrder[b.rank] - rankOrder[a.rank]); $('listDescription').textContent = `${people.length}명 표시 중 · ${selectedRoom === 'all' ? '전체 생활반' : selectedRoom}`; $('peopleList').innerHTML = people.length ? people.map((person) => `<article class="person"><div class="person-main"><div class="person-name">${escapeHtml(person.name)}</div><div class="person-info">${escapeHtml(person.roomName)} · ${escapeHtml(person.rank)} · ${escapeHtml(person.unit || '소속 미입력')}</div></div><div class="person-statuses">${['rollCall','group','weekend'].map((type) => { const status = person[type] || '정상'; return `<span class="status ${status === '정상' ? 'ok' : 'absent'}">${categoryNames[type]} ${escapeHtml(status)}</span>`; }).join('')}</div></article>`).join('') : '<div class="empty">조건에 맞는 인원이 없습니다.</div>'; }
        const reportCategories = ['휴가','국기수','당직','작업','환자','출동 수리','출장 파견','기타'];
        const reportTypes = [{ key:'rollCall', label:'점호' }, { key:'group', label:'조별' }, { key:'weekend', label:'주말점검' }];
        function reportStats(people, type) {
            const total = people.length;
            const values = people.map((person) => person[type] || '정상');
            const absent = values.filter((value) => value !== '정상').length;
            const counts = Object.fromEntries(reportCategories.map((category) => [category, values.filter((value) => value === category).length]));
            return { total, absent, current:total - absent, counts };
        }
        function sortedDetails(people, type, category) {
            return people.filter((person) => (person[type] || '정상') === category).sort((a, b) => (rankOrder[b.rank] || 0) - (rankOrder[a.rank] || 0));
        }
        function detailText(people, type, category) {
            let previousRank = '';
            return sortedDetails(people, type, category).map((person) => { const rank = person.rank === previousRank ? '' : `${person.rank} `; previousRank = person.rank; return `${rank}${person.name}`; }).join(', ');
        }
        function reportTable(people, type, label) {
            const stats = reportStats(people, type);
            const headings = ['구분','총원','부재','현재원',...reportCategories];
            const values = [label, stats.total, stats.absent, stats.current, ...reportCategories.map((category) => stats.counts[category])];
            const details = reportCategories.filter((category) => stats.counts[category] > 0).map((category) => `<tr class="detail-row"><td colspan="12"><span class="detail-label">${category}</span> ${escapeHtml(detailText(people, type, category))}</td></tr>`).join('');
            return `<div class="report-table-wrap"><table class="report-table"><thead><tr>${headings.map((heading) => `<th>${heading}</th>`).join('')}</tr></thead><tbody><tr>${values.map((value) => `<td>${escapeHtml(value)}</td>`).join('')}</tr>${details}</tbody></table></div>`;
        }
        function renderReport() {
            const entries = selectedRoom === 'all' ? roomEntries() : roomEntries().filter(([name]) => name === selectedRoom);
            $('reportTables').innerHTML = entries.length ? entries.map(([name, room]) => { const status = room.status || {}; const people = status.totalPerson || []; return `<article class="report-room"><div class="report-room-title"><strong>${escapeHtml(name)}</strong><span>${escapeHtml(status.dateStr || room.updated || '-')} · 보고자 ${escapeHtml(status.reporter || '-')}</span></div>${reportTypes.map((type) => reportTable(people, type.key, type.label)).join('')}</article>`; }).join('') : '<div class="report-empty">표시할 생활반 보고서가 없습니다.</div>';
            $('reportOutput').value = entries.map(([name, room]) => { const status = room.status || {}; const people = status.totalPerson || []; return `[${name} 인원보고]\n보고자: ${status.reporter || '-'}\n일시: ${status.dateStr || room.updated || '-'}\n${reportTypes.map((type) => { const stats = reportStats(people, type.key); const details = reportCategories.filter((category) => stats.counts[category] > 0).map((category) => `-${category}: ${detailText(people, type.key, category)}`).join('\n'); return `\n[${type.label}] 총원 ${stats.total} / 부재 ${stats.absent} / 현재원 ${stats.current}\n${reportCategories.map((category) => `${category} ${stats.counts[category]}`).join(' · ')}\n${details}`; }).join('\n')}`; }).join('\n\n');
        }
        function render() { renderRooms(); renderSummary(); renderPeople(); renderReport(); }
        async function refreshData(showMessage = false) { const loaded = await loadRooms(); render(); if (showMessage) showToast(loaded ? '최신 API 데이터를 불러왔습니다.' : 'API 연결 실패, 저장된 데이터를 표시합니다.'); }
        function showToast(message) { $('toast').textContent = message; $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 1800); }
        $('searchInput').addEventListener('input', renderPeople); $('filterSelect').addEventListener('change', renderPeople); $('refreshButton').addEventListener('click', () => refreshData(true)); $('openReportButton').addEventListener('click', () => $('reportTables').scrollIntoView({ behavior:'smooth', block:'start' })); $('copyButton').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('reportOutput').value); showToast('보고서를 복사했습니다.'); } catch { const temporary = document.createElement('textarea'); temporary.value = $('reportOutput').value; document.body.appendChild(temporary); temporary.select(); document.execCommand('copy'); temporary.remove(); showToast('보고서를 복사했습니다.'); } });
        loadRooms().then(() => render());
    </script>
</body>
</html>
